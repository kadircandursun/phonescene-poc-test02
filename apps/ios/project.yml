name: PhoneSceneIOS
options:
  bundleIdPrefix: com.phonescene
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  CURRENT_PROJECT_VERSION: "5"
  MARKETING_VERSION: "1.0.3"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 157.0.0

targets:
  PhoneSceneIOS:
    type: application
    platform: iOS
    sources:
      - path: PhoneSceneIOS
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    dependencies:
      - sdk: ARKit.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: RoomPlan.framework
      - package: WebRTC
        product: WebRTC
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mervelere.app
      PRODUCT_NAME: Mervelere
      CURRENT_PROJECT_VERSION: "5"
      MARKETING_VERSION: "1.0.3"
      INFOPLIST_FILE: PhoneSceneIOS/Info.plist
      GENERATE_INFOPLIST_FILE: "NO"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
      INFOPLIST_KEY_NSCameraUsageDescription: "PhoneScene ön kamerayı sanal mekân PoC için kullanır."
      INFOPLIST_KEY_NSMotionUsageDescription: "PhoneScene cihaz yönünü 3DoF yedek takip için kullanır."
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PhoneScene Windows Companion ile yerel ağda eşleşmek için kullanılır."
      INFOPLIST_KEY_CFBundleDisplayName: Mervelere
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      OTHER_LDFLAGS: "$(inherited) -ObjC"
    info:
      path: PhoneSceneIOS/Info.plist
      properties:
        CFBundleDisplayName: Mervelere
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "5"
        NSCameraUsageDescription: Mervelere oda fotoğrafı çekmek ve canlı yerleşim için kamerayı kullanır.
        NSPhotoLibraryUsageDescription: Mervelere kayıtlı oda fotoğraflarını mekân kütüphanesine eklemek için galeriye erişir.
        NSMotionUsageDescription: PhoneScene cihaz yönünü 3DoF yedek takip için kullanır.
        NSLocalNetworkUsageDescription: PhoneScene Windows Companion ile yerel ağda eşleşmek için kullanılır.
        NSBonjourServices:
          - _phonescene._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities:
          - armv7
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
