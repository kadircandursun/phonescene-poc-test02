name: PhoneSceneIOS
options:
  bundleIdPrefix: com.phonescene
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  CURRENT_PROJECT_VERSION: "1"
  MARKETING_VERSION: "0.1.0"

targets:
  PhoneSceneIOS:
    type: application
    platform: iOS
    sources:
      - path: PhoneSceneIOS
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.phonescene.poc
      PRODUCT_NAME: PhoneSceneIOS
      INFOPLIST_FILE: PhoneSceneIOS/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: PhoneSceneIOS/Info.plist
