name: iOS TestFlight

# Signed IPA → App Store Connect / TestFlight.
# Requires paid Apple Developer + GitHub Actions secrets (see apps/ios/TESTFLIGHT.md).

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for v in APPLE_TEAM_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See apps/ios/TESTFLIGHT.md"
            exit 1
          fi
          echo "All required secrets present."

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        uses: apple-actions/import-codesigning-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          PROFILE_NAME_OVERRIDE: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > /tmp/phonescene.mobileprovision
          PLIST=$(security cms -D -i /tmp/phonescene.mobileprovision)
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$PLIST")
          if [ -n "${PROFILE_NAME_OVERRIDE}" ]; then
            NAME="$PROFILE_NAME_OVERRIDE"
          fi
          echo "Profile UUID=$UUID Name=$NAME"
          cp /tmp/phonescene.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Generate Xcode project (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          team = os.environ["APPLE_TEAM_ID"]
          p = Path("project.yml")
          text = p.read_text()
          text = text.replace('CODE_SIGNING_ALLOWED: "NO"', 'CODE_SIGNING_ALLOWED: "YES"')
          text = text.replace('CODE_SIGNING_REQUIRED: "NO"', 'CODE_SIGNING_REQUIRED: "YES"')
          text = text.replace('DEVELOPMENT_TEAM: ""', f'DEVELOPMENT_TEAM: "{team}"')
          text = text.replace('CODE_SIGN_IDENTITY: ""', 'CODE_SIGN_IDENTITY: "Apple Distribution"')
          p.write_text(text)
          PY
          xcodegen generate

      - name: Build archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
          xcodebuild \
            -project PhoneSceneIOS.xcodeproj \
            -scheme PhoneSceneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/PhoneSceneIOS.xcarchive \
            -derivedDataPath build/DerivedData \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ExportOptions-AppStore.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.mervelere.app $PROFILE_NAME" ExportOptions-AppStore.plist
          xcodebuild -exportArchive \
            -archivePath build/PhoneSceneIOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions-AppStore.plist
          ls -lh build/export

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSceneIOS-testflight
          path: apps/ios/build/export/*.ipa
          retention-days: 14

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
