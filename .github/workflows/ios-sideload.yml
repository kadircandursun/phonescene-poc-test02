name: iOS Sideload IPA

# Builds an unsigned IPA on GitHub-hosted macOS for Sideloadly (free Apple ID).
# Usage:
# 1. Push this repo to GitHub (public = free macOS minutes)
# 2. Actions → "iOS Sideload IPA" → Run workflow
# 3. Download artifact PhoneSceneIOS-sideload.ipa
# 4. Windows: Sideloadly + USB iPhone + free Apple ID
#
# Limits: free Apple ID apps expire ~7 days; ARKit needs a real iPhone (TrueDepth).

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-sideload.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no codesign)
        run: |
          set -euo pipefail
          xcodebuild \
            -project PhoneSceneIOS.xcodeproj \
            -scheme PhoneSceneIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find build/DerivedData -name "*.app" | head -20
            exit 1
          fi
          echo "Packaging: $APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          rm -f PhoneSceneIOS-sideload.ipa
          zip -qr PhoneSceneIOS-sideload.ipa Payload
          ls -lh PhoneSceneIOS-sideload.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSceneIOS-sideload
          path: apps/ios/build/PhoneSceneIOS-sideload.ipa
          retention-days: 14
